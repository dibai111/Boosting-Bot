cargo-features = ["profile-rustflags", "trim-paths"]

[workspace]
resolver = "2"
members = [
  "apps/user-desktop/src-tauri",
  "crates/local-store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["baibai"]
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
trim-paths = "all"
debug = false
incremental = false
overflow-checks = false

[workspace.dependencies]
anyhow = "1.0"
azalea = { version = "=0.16.0", default-features = false, features = ["online-mode"] }
base64 = "0.22"
bevy_ecs = { version = "=0.18.1", default-features = false, features = ["multi_threaded"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8", features = [] }
tokio = { version = "1.50", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
