<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Botting workflow</title>
  <desc id="desc">Startup animation leads to account management, bot runtime, matchmaking and session logs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#41556b" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6c87a1"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <circle cx="1030" cy="90" r="80" fill="#f3b266" opacity=".18"/>
  <circle cx="170" cy="465" r="100" fill="#5fb7ad" opacity=".12"/>
  <text x="72" y="82" fill="#203448" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Botting workflow</text>
  <text x="74" y="115" fill="#667d91" font-family="Segoe UI, Arial, sans-serif" font-size="17">A compact control surface for Minecraft bot sessions</text>

  <g filter="url(#shadow)">
    <rect x="72" y="180" width="230" height="164" rx="18" fill="#ffffff"/>
    <rect x="332" y="180" width="230" height="164" rx="18" fill="#ffffff"/>
    <rect x="592" y="180" width="230" height="164" rx="18" fill="#ffffff"/>
    <rect x="852" y="180" width="276" height="164" rx="18" fill="#ffffff"/>
  </g>

  <path d="M302 262H320" stroke="#6c87a1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M562 262H580" stroke="#6c87a1" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M822 262H840" stroke="#6c87a1" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="112" cy="222" r="22" fill="#389df6"/>
    <text x="112" y="230" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">1</text>
    <text x="98" y="278" fill="#203448" font-size="21" font-weight="700">Start</text>
    <text x="98" y="308" fill="#667d91" font-size="15">Animation stays on entry</text>
    <text x="98" y="330" fill="#667d91" font-size="15">No activation screen</text>

    <circle cx="372" cy="222" r="22" fill="#5fb7ad"/>
    <text x="372" y="230" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">2</text>
    <text x="358" y="278" fill="#203448" font-size="21" font-weight="700">Accounts</text>
    <text x="358" y="308" fill="#667d91" font-size="15">Microsoft, token or cookie</text>
    <text x="358" y="330" fill="#667d91" font-size="15">One account becomes one bot</text>

    <circle cx="632" cy="222" r="22" fill="#f09b4d"/>
    <text x="632" y="230" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">3</text>
    <text x="618" y="278" fill="#203448" font-size="21" font-weight="700">Run bots</text>
    <text x="618" y="308" fill="#667d91" font-size="15">Start, stop and configure</text>
    <text x="618" y="330" fill="#667d91" font-size="15">Independent server targets</text>

    <circle cx="892" cy="222" r="22" fill="#7f9bd1"/>
    <text x="892" y="230" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">4</text>
    <text x="878" y="278" fill="#203448" font-size="21" font-weight="700">Matchmaking &amp; logs</text>
    <text x="878" y="308" fill="#667d91" font-size="15">Queue bots into supported modes</text>
    <text x="878" y="330" fill="#667d91" font-size="15">Watch live session events</text>
  </g>

  <rect x="72" y="408" width="1056" height="70" rx="16" fill="#203448" opacity=".96"/>
  <text x="102" y="451" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17">Standalone fork</text>
  <text x="300" y="451" fill="#c8d8e7" font-family="Segoe UI, Arial, sans-serif" font-size="16">No product activation, cloud license checks or feedback submission screen</text>
</svg>
